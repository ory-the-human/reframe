<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>reframe</title>
  <style>
    :root {
      --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a66;
      --border: #e3e1dc; --accent: #2f6f5e; --accent-text: #ffffff;
      --ok: #2f6f5e; --warn: #9a6400; --error: #b3261e; --code: #efede8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615; --card: #1f1f1d; --text: #ecebe7; --muted: #9c9a94;
        --border: #33322f; --accent: #6fbfa6; --accent-text: #10201b;
        --ok: #6fbfa6; --warn: #e0a84a; --error: #f08a80; --code: #2a2a27;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
    header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
    header h1 { font-size: 20px; margin: 0; }
    header nav a { color: var(--muted); margin-left: 16px; text-decoration: none; }
    header nav a:hover { color: var(--text); }
    section { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
              padding: 18px 20px; margin-bottom: 16px; }
    h2 { font-size: 16px; margin: 0 0 10px; display: flex; gap: 10px; align-items: center; }
    p { margin: 6px 0; }
    .muted { color: var(--muted); }
    .badge { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; }
    .ok { color: var(--ok); } .warn { color: var(--warn); } .error { color: var(--error); }
    code, .code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 13px;
                  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
    .usercode { font-size: 28px; letter-spacing: 3px; font-weight: 600; padding: 4px 12px; }
    .qr svg { width: 180px; height: 180px; background: #fff; border-radius: 6px; }
    a { color: var(--accent); }
    .actions { display: flex; gap: 8px; margin: 8px 0; }
    .qr.small svg { width: 120px; height: 120px; }
    .frame { border-top: 1px solid var(--border); padding: 12px 0 4px; }
    .frame:first-of-type { border-top: 0; padding-top: 0; }
    .checks label { display: inline-flex; gap: 6px; align-items: center; font-weight: 400; margin: 4px 16px 4px 0; }
    .row { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
    form.inline { display: inline; }
    button, .button { font: inherit; background: var(--accent); color: var(--accent-text); border: 0;
                      border-radius: 6px; padding: 7px 14px; cursor: pointer; text-decoration: none; display: inline-block; }
    button.secondary, .button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    button.danger { background: transparent; color: var(--error); border: 1px solid var(--error); }
    label { display: block; margin: 12px 0 4px; font-weight: 500; }
    input[type=text], input[type=url], input[type=password], input[type=number], select {
      width: 100%; font: inherit; padding: 7px 10px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text); }
    input[type=number] { width: 80px; }
    input[type=time] { font: inherit; padding: 6px 8px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text); }
    .spark { display: block; color: var(--accent); }
    .spark polyline { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .check label { display: inline; font-weight: 400; margin: 0 16px 0 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    td, th { text-align: left; padding: 5px 8px 5px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
    .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; border: 1px solid currentColor; }
    ul.ids { margin: 4px 0; padding-left: 18px; max-height: 160px; overflow: auto; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>reframe</h1>
    <nav><a href="{{ url_for('index') }}">Dashboard</a><a href="{{ url_for('settings') }}">Settings</a></nav>
  </header>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
