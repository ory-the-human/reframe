{% extends "base.html" %}
{% block content %}
<section>
  <h2>{{ album.name }}</h2>
  <form method="post" action="{{ url_for('album_upload', album_id=album.id) }}" enctype="multipart/form-data">
    <label for="files">Add photos and videos</label>
    <input type="file" id="files" name="files" multiple accept="image/*,video/*" required>
    <p style="margin-top:12px"><button>Upload</button></p>
  </form>
  <p class="muted">Files copied into <code>data/albums/{{ album.id }}/</code> show up here too.
    <a href="{{ url_for('settings') }}#albums">All albums</a></p>
</section>
<section>
  {% if items %}
  <div class="grid">
    {% for i in items %}
    <div>
      {% if i.video %}<video src="{{ url_for('album_file', album_id=album.id, name=i.name) }}" preload="metadata" muted controls></video>
      {% else %}<img src="{{ url_for('album_file', album_id=album.id, name=i.name) }}" loading="lazy" alt="{{ i.name }}">{% endif %}
      <form method="post" action="{{ url_for('album_file_delete', album_id=album.id, name=i.name) }}"
            onsubmit='return confirm({{ ("Delete " ~ i.name ~ "? The next sync takes it off the frames.") | tojson }})'>
        <button class="danger">Delete</button></form>
    </div>
    {% endfor %}
  </div>
  {% else %}
  <p class="muted">Nothing here yet.</p>
  {% endif %}
</section>
{% endblock %}
