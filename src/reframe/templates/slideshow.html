<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>reframe slideshow</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
    #stage { position: absolute; left: 50%; top: 50%; overflow: hidden; }
    .slide { position: absolute; inset: 0; display: flex; gap: 6px; opacity: 0;
             transition: opacity 1.2s ease; }
    .slide.pair { background: #fff; }
    /* Two photos fill their halves (trimming a little), split by a white line. */
    .slide.pair .cell img { object-fit: cover; }
    .slide.shown { opacity: 1; }
    .slide.column { flex-direction: column; }
    .cell { position: relative; flex: 1 1 0; min-width: 0; min-height: 0; overflow: hidden; }
    .cell img, .cell video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    /* A tiny copy of the photo, stretched and blurred, fills the space around it. */
    .cell canvas { position: absolute; inset: -10%; width: 120%; height: 120%; object-fit: cover;
                   filter: blur(24px) brightness(0.75); }
    .date { position: absolute; bottom: 12px; width: 100%; text-align: center; color: #fff;
            font: 14px system-ui, sans-serif; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); }
    #message { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
               color: #888; font: 18px system-ui, sans-serif; text-align: center; padding: 24px; }
    /* The settings panel, only when the frame's agent serves the page. */
    #gear, #panel { position: fixed; display: none; color: #fff; font: 26px system-ui, sans-serif;
                    background: rgba(0, 0, 0, 0.75); border-radius: 16px; }
    #gear { top: 16px; right: 16px; padding: 12px 22px; font-size: 48px; }
    #panel { top: 16px; right: 16px; padding: 12px 28px; width: 600px; max-width: calc(100vw - 32px); box-sizing: border-box; }
    #panel .row { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 72px; margin: 16px 0; }
    #panel button { font: inherit; min-width: 80px; min-height: 72px; padding: 0 24px; border: 0; border-radius: 12px; background: #444; color: #fff; }
    #panel .row > button { flex: 1; }
    #panel .row > span { display: flex; align-items: center; gap: 12px; }
    #panel b { min-width: 64px; text-align: center; }
    #panel input[type=checkbox] { width: 48px; height: 48px; }
    #panel input[type=range] { flex: 1; height: 72px; -webkit-appearance: none; background: transparent; }
    #panel input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 5px; background: #666; }
    #panel input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 48px; height: 48px; margin-top: -19px;
                                                     border-radius: 50%; background: #fff; }
    #networks { max-height: 50vh; overflow-y: auto; }
    #networks button { display: flex; justify-content: space-between; align-items: center; width: 100%; margin: 8px 0; text-align: left; }
    #networks small { font-size: 20px; color: #bbb; }
    #password { font: inherit; width: 100%; box-sizing: border-box; min-height: 72px; padding: 0 16px; border: 0; border-radius: 12px; }
    #wifistatus:empty { display: none; }
  </style>
</head>
<body>
<div id="stage"><div id="message">Loading…</div></div>
<div id="gear">⚙</div>
<div id="panel">
  <div id="main">
    <div class="row">Seconds per photo
      <span><button id="slower">−</button> <b id="interval"></b> <button id="faster">+</button></span></div>
    <label class="row">Sound <input type="checkbox" id="sound"></label>
    <div class="row">Volume <input type="range" id="volume" min="0" max="100"></div>
    <div class="row"><button id="wifi">Wi-Fi</button> <button id="close">Close</button></div>
  </div>
  <div id="wifiview" hidden>
    <div id="networks"></div>
    <div id="join" hidden>
      <div class="row"><b id="joinname"></b></div>
      <input type="password" id="password">
      <div class="row"><button id="connect">Connect</button></div>
    </div>
    <p id="wifistatus"></p>
    <div class="row"><button id="back">Back</button></div>
  </div>
</div>
<script>
(function () {
  "use strict";
  var base = {{ url_for('slideshow', key=key) | tojson }};
  var PAGE_VERSION = {{ page_version | tojson }};
  var newPage = null;   // a newer page's version, loaded at the next photo
  var params = new URLSearchParams(location.search);
  var stage = document.getElementById("stage");
  var message = document.getElementById("message");
  var REFRESH_MS = 10 * 1000;  // how often to check for new photos and settings
  var MAX_VIDEO_MS = 5 * 60 * 1000;

  var display = null;   // settings from the server, with URL overrides applied
  var items = [];       // [{name, type, taken}]
  var queue = [];       // names still to show this round
  var timer = null;
  var current = null;   // the slide element on screen
  var history = [];     // names on each slide shown, for swiping back
  var pos = -1;         // index in history of the slide on screen
  var HISTORY_MAX = 50;
  var seq = 0;          // bumped per slide change, so a slow load can't override a newer one
  var agentHere = false; // served by the frame's agent, which offers the settings panel

  // Each screen can override the shared settings: ?interval=10&layout=pair&orientation=portrait&shuffle=no&fill=black&date=no
  function applyOverrides(d) {
    var out = Object.assign({}, d);
    if (params.get("interval")) out.interval = Math.max(3, parseInt(params.get("interval"), 10) || d.interval);
    if (params.get("layout")) out.layout = params.get("layout");
    if (params.get("orientation")) out.orientation = params.get("orientation");
    if (params.get("shuffle")) out.shuffle = params.get("shuffle") !== "no";
    if (params.get("fill")) out.fill = params.get("fill");
    if (params.get("date")) out.date = params.get("date") !== "no";
    return out;
  }

  // Orientation: "auto" follows the screen. A fixed choice that doesn't match what
  // the browser reports rotates the picture, for screens mounted sideways.
  function screenIsPortrait() { return window.innerHeight > window.innerWidth; }

  function targetIsPortrait() {
    var o = display ? display.orientation : "auto";
    if (o === "auto") return screenIsPortrait();
    return o.indexOf("portrait") === 0;
  }

  function layoutStage() {
    var o = display ? display.orientation : "auto";
    var flipped = /-flipped$/.test(o);
    var mismatch = o !== "auto" && targetIsPortrait() !== screenIsPortrait();
    var angle = mismatch ? (flipped ? 270 : 90) : (flipped ? 180 : 0);
    var w = window.innerWidth, h = window.innerHeight;
    if (mismatch) { var t = w; w = h; h = t; }
    stage.style.width = w + "px";
    stage.style.height = h + "px";
    stage.style.transform = "translate(-50%, -50%) rotate(" + angle + "deg)";
  }

  function shuffled(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function byName(name) {
    for (var i = 0; i < items.length; i++) if (items[i].name === name) return items[i];
    return null;
  }

  function nextItem() {
    // Drop names that were removed since the queue was built.
    while (queue.length && !byName(queue[0])) queue.shift();
    if (!queue.length) {
      var names = items.map(function (i) { return i.name; });
      queue = display.shuffle ? shuffled(names) : names;
    }
    return queue.length ? byName(queue.shift()) : null;
  }

  function peekItem() {
    while (queue.length && !byName(queue[0])) queue.shift();
    return queue.length ? byName(queue[0]) : null;
  }

  function mediaUrl(item) { return base + "/media/" + encodeURIComponent(item.name); }

  function loadImage(item) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.taken = item.taken;
      img.onload = function () { resolve(img); };
      img.onerror = function () { resolve(null); };
      img.src = mediaUrl(item);
    });
  }

  function isPortrait(img) { return img.naturalHeight > img.naturalWidth; }

  // A photo "fits badly" when its orientation is the opposite of the screen's,
  // e.g. a portrait photo on a landscape frame. Two of those share the screen.
  function fitsBadly(img) { return isPortrait(img) !== targetIsPortrait(); }

  function blurredCopy(img) {
    var canvas = document.createElement("canvas");
    canvas.width = 24;
    canvas.height = Math.max(1, Math.round(24 * img.naturalHeight / img.naturalWidth));
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
    return canvas;
  }

  function cell(el, alone) {
    var div = document.createElement("div");
    div.className = "cell";
    if (alone && el.tagName === "IMG" && display.fill !== "black") div.appendChild(blurredCopy(el));
    div.appendChild(el);
    if (display.date && el.taken) {
      var date = document.createElement("div");
      date.className = "date";
      // The date where it was taken: the stamp's own YYYY-MM-DD, not the frame's zone.
      date.textContent = new Date(el.taken.slice(0, 10) + "T12:00:00Z").toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
      div.appendChild(date);
    }
    return div;
  }

  function show(elements, stacked) {
    var slide = document.createElement("div");
    slide.className = "slide" + (stacked ? " column" : "") + (elements.length > 1 ? " pair" : "");
    elements.forEach(function (el) { slide.appendChild(cell(el, elements.length === 1)); });
    stage.appendChild(slide);
    message.style.display = "none";
    // Force a layout so the fade-in transition runs.
    void slide.offsetWidth;
    slide.classList.add("shown");
    var old = current;
    current = slide;
    if (old) setTimeout(function () { old.remove(); }, 1300);
  }

  function schedule(ms) {
    clearTimeout(timer);
    timer = setTimeout(advance, ms);
  }

  function showVideo(item) {
    var video = document.createElement("video");
    video.muted = !(agentHere && display.sound);
    video.autoplay = true;
    video.playsInline = true;
    video.src = mediaUrl(item);
    video.taken = item.taken;
    video.onended = function () { schedule(0); };
    video.onerror = function () { schedule(0); };
    show([video], false);
    schedule(MAX_VIDEO_MS);
  }

  function showImages(imgs) {
    // Two photos: side by side on a landscape screen, stacked on a portrait one.
    show(imgs, imgs.length > 1 && targetIsPortrait());
    schedule(display.interval * 1000);
  }

  function record(names) {
    history.push(names);
    if (history.length > HISTORY_MAX) history.shift();
    pos = history.length - 1;
  }

  // Show a slide from history again (after swiping back, or forward again).
  function go(index) {
    var my = ++seq;
    var list = history[index].map(byName).filter(Boolean);
    if (!list.length) { history.splice(index, 1); pos = Math.min(pos, history.length - 1); advance(); return; }
    pos = index;
    if (list[0].type === "video") { showVideo(list[0]); return; }
    Promise.all(list.map(loadImage)).then(function (imgs) {
      if (my !== seq) return;
      imgs = imgs.filter(Boolean);
      if (imgs.length) showImages(imgs); else schedule(0);
    });
  }

  function advance() {
    if (newPage && reloadOnce(newPage)) return;
    if (pos < history.length - 1) { go(pos + 1); return; }
    var my = ++seq;
    if (!items.length) {
      message.textContent = "No photos yet. They appear here once reframe has synced some.";
      message.style.display = "flex";
      if (current) { current.remove(); current = null; }
      schedule(REFRESH_MS);
      return;
    }
    var item = nextItem();
    if (item.type === "video") { record([item.name]); showVideo(item); return; }
    loadImage(item).then(function (img) {
      if (my !== seq) return;
      if (!img) { schedule(0); return; }
      var candidate = display.layout === "pair" && fitsBadly(img) ? peekItem() : null;
      var second = candidate && candidate.type === "image" && candidate.name !== item.name
        ? loadImage(candidate) : Promise.resolve(null);
      return second.then(function (img2) {
        if (my !== seq) return;
        if (img2 && fitsBadly(img2)) {
          queue.shift();
          record([item.name, candidate.name]);
          showImages([img, img2]);
        } else {
          record([item.name]);
          showImages([img]);
        }
      });
    });
  }

  // Once per version, so a page that still comes back old can't reload in a loop.
  function reloadOnce(version) {
    try {
      if (sessionStorage.getItem("page_version") === version) return false;
      sessionStorage.setItem("page_version", version);
    } catch (e) {}
    location.reload();
    return true;
  }

  function back() {
    if (pos > 0) go(pos - 1);
  }

  function refresh(first) {
    return fetch(base + "/playlist", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var before = display ? JSON.stringify(display) : null;
        display = applyOverrides(data.display);
        items = data.items;
        agentHere = !!data.agent;
        if (data.page_version && data.page_version !== PAGE_VERSION) newPage = data.page_version;
        if (before !== JSON.stringify(display)) {
          queue = [];
          layoutStage();
          showSettings();
          var video = current && current.querySelector("video");
          if (video) video.muted = !(agentHere && display.sound);
          // A new interval applies to the photo on screen too, not only the next one.
          if (!first && current && !current.querySelector("video")) schedule(display.interval * 1000);
        }
        if (first) advance();
      })
      .catch(function () {
        // Keep showing what we have; try again later.
        if (first) { message.textContent = "Can't reach reframe. Retrying…"; setTimeout(function () { refresh(true); }, 10000); }
      });
  }

  window.addEventListener("resize", layoutStage);
  window.addEventListener("orientationchange", layoutStage);
  // Swipe (or arrow keys) for the next or previous photo.
  var touchX = null, touchY = null;
  document.addEventListener("touchstart", function (e) {
    if (panel.contains(e.target)) return;
    touchX = e.changedTouches[0].clientX;
    touchY = e.changedTouches[0].clientY;
  }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX, dy = e.changedTouches[0].clientY - touchY;
    touchX = null;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
    if (dx < 0) advance(); else back();
  }, { passive: true });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") advance();
    if (e.key === "ArrowLeft") back();
  });
  document.addEventListener("click", function () {
    var el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(function () {});
  });

  // Settings panel: a tap shows the gear for a few seconds, the gear opens the panel.
  var gear = document.getElementById("gear"), panel = document.getElementById("panel");
  var gearTimer = null, panelTimer = null;
  function $(id) { return document.getElementById(id); }
  document.addEventListener("click", function (e) {
    if (!agentHere || panel.style.display === "block" || e.target === gear) return;
    gear.style.display = "block";
    clearTimeout(gearTimer);
    gearTimer = setTimeout(function () { gear.style.display = "none"; }, 15000);
  });
  function closePanel() { panel.style.display = "none"; showMain(); }
  function touched() { clearTimeout(panelTimer); panelTimer = setTimeout(closePanel, 45000); }
  gear.addEventListener("click", function () {
    gear.style.display = "none";
    panel.style.display = "block";
    showSettings();
    touched();
  });
  panel.addEventListener("touchstart", touched, { passive: true });
  panel.addEventListener("click", touched);
  panel.addEventListener("input", touched);
  function showSettings() {
    $("interval").textContent = display.interval + " s";
    $("sound").checked = display.sound;
    $("volume").value = display.volume;
  }
  // Applies at once on the frame; the agent passes it on to the server.
  function save(changes) {
    fetch(base + "/settings", { method: "POST", body: JSON.stringify(changes) })
      .then(function () { return refresh(false); });
  }
  function step(dir) {
    var v = display.interval;
    save({ interval: Math.max(5, Math.min(300, v % 5 ? Math.round(v / 5) * 5 : v + 5 * dir)) });
  }
  $("slower").addEventListener("click", function () { step(-1); });
  $("faster").addEventListener("click", function () { step(1); });
  $("sound").addEventListener("change", function () { save({ sound: this.checked }); });
  $("volume").addEventListener("change", function () { save({ volume: parseInt(this.value, 10) }); });

  // Wi-Fi: the nearby networks, and joining one. The list refreshes while it's open.
  var wifiTimer = null, joining = null;
  function showMain() { clearTimeout(wifiTimer); $("wifiview").hidden = true; $("main").hidden = false; }
  function showNetworks() {
    $("main").hidden = true; $("wifiview").hidden = false;
    $("join").hidden = true; $("networks").hidden = false;
    $("wifistatus").textContent = "Looking for networks…";
    loadNetworks();
  }
  function loadNetworks() {
    clearTimeout(wifiTimer);
    fetch(base + "/wifi").then(function (r) { return r.json(); }).then(function (w) {
      if ($("wifiview").hidden) return;
      var list = $("networks");
      list.innerHTML = "";
      w.networks.forEach(function (n) {
        var b = document.createElement("button"), note = document.createElement("small");
        b.textContent = n.ssid;
        note.textContent = (n.ssid === w.current ? "Connected" : n.saved ? "Saved" : n.secure ? "Password" : "Open")
          + " " + "▂▄▆█".slice(0, n.bars + 1);
        b.appendChild(note);
        b.addEventListener("click", function () { pick(n, w.current); });
        list.appendChild(b);
      });
      if (joining && w.current === joining) {
        $("wifistatus").textContent = "Connected to " + joining + ".";
        joining = null;
      } else if (!joining) {
        $("wifistatus").textContent = w.networks.length ? "" : "Looking for networks…";
      }
      wifiTimer = setTimeout(loadNetworks, 5000);
    });
  }
  function pick(n, current) {
    if (n.ssid === current) return;
    if (!n.secure) return join(n.ssid, "");
    $("networks").hidden = true;
    $("join").hidden = false;
    $("joinname").textContent = n.ssid;
    $("password").value = "";
    $("password").placeholder = n.saved ? "Saved password (or type a new one)" : "Password";
    $("password").focus();
  }
  function join(ssid, password) {
    $("join").hidden = true;
    $("networks").hidden = false;
    $("wifistatus").textContent = "Connecting to " + ssid + "…";
    fetch(base + "/wifi", { method: "POST", body: JSON.stringify({ ssid: ssid, password: password }) })
      .then(function (r) { return r.json(); }).then(function (r) {
        joining = r.ok ? ssid : null;
        if (!r.ok) $("wifistatus").textContent = "Couldn't join " + ssid + ".";
        setTimeout(function () {
          if (joining !== ssid) return;
          joining = null;
          $("wifistatus").textContent = "Couldn't connect to " + ssid + ". Check the password.";
        }, 30000);
        loadNetworks();
      });
  }
  $("wifi").addEventListener("click", showNetworks);
  $("connect").addEventListener("click", function () { join($("joinname").textContent, $("password").value); });
  $("back").addEventListener("click", function () { joining = null; $("join").hidden ? showMain() : showNetworks(); });
  $("close").addEventListener("click", closePanel);

  // Keep the screen on where the browser allows it (needs HTTPS or localhost).
  function keepAwake() {
    if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(function () {});
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) keepAwake(); });
  keepAwake();

  layoutStage();
  refresh(true);
  setInterval(function () { refresh(false); }, REFRESH_MS);
})();
</script>
</body>
</html>
