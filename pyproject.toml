[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reframe"
version = "0.1.3"
description = "Self-hosted worker that syncs photo albums to photo frames, with pluggable sources and frames"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "qrcode>=7.4",
    "flask>=3.0",
    "waitress>=3.0",
    "pillow>=10",
]

[project.scripts]
reframe = "reframe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reframe = ["templates/*.html"]
