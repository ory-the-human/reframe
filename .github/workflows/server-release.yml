name: Server release
on:
  push:
    tags: ['v*']
jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the version
        run: grep -qx "version = \"${VERSION#v}\"" pyproject.toml || { echo "pyproject.toml is not ${VERSION#v}"; exit 1; }
      - name: Build and push
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run --privileged --rm tonistiigi/binfmt@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6 --install arm64
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "$IMAGE:${VERSION#v}" -t "$IMAGE:latest" .
